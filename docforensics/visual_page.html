<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inspect visual marks</title>
<style>body{font:16px/1.5 system-ui;margin:24px;background:#f5f7fa;color:#172433}main{max-width:1100px;margin:auto}section{background:white;padding:20px;border:1px solid #ccd5df;margin:18px 0}button{margin:6px;padding:10px;cursor:pointer}.canvas{overflow:auto}svg{width:100%;display:block}img{max-width:100%}#error{color:#a51522}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<main><h1>Inspect visual marks</h1><p>This check looks for blue ink close to or overlapping dark printed content. It does not verify authenticity. Digital edits, black-ink changes, and other visual signals are outside this check.</p><button id="run">Inspect this case</button><p id="status" role="status"></p><p id="error" role="alert"></p><div id="results"></div>
<section id="source" hidden><h2>Source region and crop</h2><p id="selected"></p><label>Page size <input id="zoom" type="range" min="50" max="150" value="100"></label><div class="canvas"><svg id="page" viewBox="0 0 1 1"><image id="image"/><rect id="region" fill="none" stroke="red" stroke-width="3" vector-effect="non-scaling-stroke"/></svg></div><h3>Selected source crop</h3><img id="crop" alt="Verified original pixels from the observed region"></section></main>
<script>
const $=id=>document.getElementById(id),caseId=new URLSearchParams(location.search).get('case');let generation=0,activeURL=null;
function text(parent,value){const p=document.createElement('p');p.textContent=value;parent.appendChild(p);}
async function show(item,run){$('source').hidden=true;const token=++generation,f=item.finding,r=f.evidence[0].region,base=`/api/ingestion/cases/${encodeURIComponent(caseId)}/visual/${run}/evidence/${encodeURIComponent(f.finding_id)}`;
 const response=await fetch(base+'/page');if(!response.ok)throw new Error('Source changed or evidence is unavailable.');const url=URL.createObjectURL(await response.blob()),image=new Image();
 try{await new Promise((ok,fail)=>{image.onload=ok;image.onerror=fail;image.src=url;});if(token!==generation){URL.revokeObjectURL(url);return;}
 $('page').setAttribute('viewBox',`0 0 ${image.width} ${image.height}`);for(const [key,value]of Object.entries({href:url,width:image.width,height:image.height}))$('image').setAttribute(key,value);
 for(const [key,value]of Object.entries({x:r.x1*image.width,y:r.y1*image.height,width:(r.x2-r.x1)*image.width,height:(r.y2-r.y1)*image.height}))$('region').setAttribute(key,value);
 const cropped=await fetch(base+'/crop');if(!cropped.ok)throw new Error('Verified crop unavailable');const cropURL=URL.createObjectURL(await cropped.blob());const oldCrop=$('crop').src;$('crop').src=cropURL;if(oldCrop.startsWith('blob:'))URL.revokeObjectURL(oldCrop);
 if(activeURL)URL.revokeObjectURL(activeURL);activeURL=url;$('selected').textContent=`${f.evidence[0].document_id} · Page ${r.page_number} · Source SHA-256 ${item.source_sha256}`;$('source').hidden=false;$('source').scrollIntoView();
 }catch(error){URL.revokeObjectURL(url);throw error;}}
$('zoom').oninput=e=>{$('page').style.width=e.target.value+'%';};
$('run').onclick=async()=>{$('run').disabled=true;$('results').replaceChildren();$('source').hidden=true;generation++;$('error').textContent='';$('status').textContent='Inspecting pages locally with per-page time limits…';
 try{if(!caseId)throw new Error('Open a saved case from the upload screen first.');const response=await fetch(`/api/ingestion/cases/${encodeURIComponent(caseId)}/visual`,{method:'POST',headers:{'X-Local-Upload':'1'}}),result=await response.json();if(!response.ok)throw new Error(result.detail||'Inspection failed');
 const saved=document.createElement('a');saved.href=`/api/ingestion/cases/${encodeURIComponent(caseId)}/visual/${result.run_id}`;saved.textContent='View saved visual report';$('results').appendChild(saved);
 for(const doc of result.documents){text($('results'),`${doc.filename}: ${doc.status}`);if(doc.error)text($('results'),doc.error);for(const page of doc.pages)text($('results'),`Page ${page.page_number}: ${page.status}; ${page.observations||0} observed region(s). ${page.error||page.warning||''}`);}
 for(const upload of result.uploads)if(upload.status==='rejected')text($('results'),`${upload.filename}: rejected — ${upload.error.message}`);
 for(const item of result.findings){const section=document.createElement('section');text(section,item.finding.observation);text(section,item.finding.explanation);text(section,`${item.signal.blue_pixels} blue pixels; ${item.signal.near_dark_pixels} nearby dark pixels. ${item.confidence_note}`);const button=document.createElement('button');button.textContent='Inspect highlighted source and crop';button.onclick=()=>show(item,result.run_id).catch(error=>{$('error').textContent=error.message;});section.appendChild(button);$('results').appendChild(section);}
 text($('results'),result.limits);$('status').textContent=`${result.findings.length} uncalibrated review lead(s). No observations does not mean the page is authentic or unaltered.`;
 }catch(error){$('error').textContent=error.message;$('status').textContent='Could not finish inspection.';}finally{$('run').disabled=false;}};
</script></html>
